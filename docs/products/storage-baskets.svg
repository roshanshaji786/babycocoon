<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F8E8EE"/>
    </linearGradient>
    <linearGradient id="basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9B08C"/>
      <stop offset="100%" stop-color="#B98A62"/>
    </linearGradient>
    <linearGradient id="blanket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F48FB1"/>
      <stop offset="100%" stop-color="#E91E8C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="700" rx="260" ry="28" fill="#00000012"/>
  <!-- big basket -->
  <path d="M210 330 h380 l-30 300 q-5 40 -45 40 h-230 q-40 0 -45 -40 z" fill="url(#basket)"/>
  <path d="M210 330 h380 l-8 70 h-364 z" fill="#C69A6F"/>
  <!-- woven texture -->
  <path d="M250 420 h300 M235 480 h330 M225 540 h350 M222 600 h356" stroke="#A87E58" stroke-width="6" opacity="0.55" fill="none"/>
  <path d="M290 380 v280 M350 380 v280 M410 380 v280 M470 380 v280 M530 380 v280" stroke="#A87E58" stroke-width="6" opacity="0.45" fill="none"/>
  <!-- rolled blankets -->
  <rect x="255" y="245" width="130" height="105" rx="20" fill="url(#blanket)"/>
  <rect x="270" y="228" width="100" height="95" rx="18" fill="#F8BBD0"/>
  <rect x="425" y="265" width="120" height="95" rx="20" fill="#B3E5FC"/>
  <rect x="435" y="250" width="100" height="90" rx="18" fill="#FFF9C4"/>
  <!-- small basket -->
  <path d="M560 470 h120 l-20 160 q-3 30 -40 30 h-80 q-37 0 -40 -30 z" fill="url(#basket)"/>
  <path d="M560 470 h120 l-5 45 h-110 z" fill="#C69A6F"/>
  <path d="M580 530 h80 M572 580 h96 M570 630 h100" stroke="#A87E58" stroke-width="5" opacity="0.5" fill="none"/>
  <!-- tiny teddy peeking -->
  <circle cx="620" cy="470" r="20" fill="#FFF3E0"/>
  <circle cx="608" cy="456" r="9" fill="#FFF3E0"/>
  <circle cx="632" cy="456" r="9" fill="#FFF3E0"/>
  <circle cx="620" cy="466" r="5" fill="#FFCCBC"/>
</svg>
