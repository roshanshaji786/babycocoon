<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F3E5F5"/>
    </linearGradient>
    <linearGradient id="wrapA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8BBD0"/>
      <stop offset="100%" stop-color="#E91E8C"/>
    </linearGradient>
    <linearGradient id="wrapB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9E8"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="4" fill="#FFFFFF" opacity="0.85"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="690" rx="300" ry="30" fill="#00000012"/>
  <!-- folded swaddle A -->
  <g>
    <rect x="140" y="330" width="520" height="330" rx="46" fill="url(#wrapA)"/>
    <rect x="140" y="330" width="520" height="330" rx="46" fill="url(#dots)"/>
    <path d="M140 470 q260 -70 520 0" stroke="#FFFFFF" stroke-width="10" opacity="0.7" fill="none"/>
    <path d="M310 660 q-30 -160 60 -250 q70 -70 160 -70" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85"/>
    <rect x="140" y="600" width="520" height="60" rx="30" fill="#C2185B" opacity="0.18"/>
  </g>
  <!-- rolled wrap B -->
  <g transform="rotate(-8 590 280)">
    <rect x="470" y="200" width="240" height="150" rx="75" fill="url(#wrapB)"/>
    <ellipse cx="710" cy="275" rx="78" ry="75" fill="#F5E6C8" stroke="#E6CFA8" stroke-width="4"/>
    <ellipse cx="710" cy="275" rx="40" ry="38" fill="#FFF9E8"/>
    <path d="M500 230 q40 45 0 90 M540 218 q40 45 0 90 M580 210 q40 45 0 90" stroke="#E6CFA8" stroke-width="5" fill="none" opacity="0.7"/>
  </g>
  <!-- star accents -->
  <g fill="#F48FB1" opacity="0.5">
    <path d="M120 200 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8 z"/>
    <path d="M680 140 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 z"/>
    <path d="M700 420 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z"/>
  </g>
</svg>
